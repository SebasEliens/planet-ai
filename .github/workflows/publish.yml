name: publish

on:
  push:
    branches: [main]
    paths:
      - "kb/**"
      - "genui/**"
      - "scripts/**"
      - "taxonomy.yaml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Validate bundle
        run: uv run python -m scripts.validate

      - name: Project kb/ -> build/okf
        run: uv run python -m scripts.project

      - name: Build site with Kiso
        uses: oak-invest/kiso/applications/kiso-cli-action@v0.2.3
        with:
          version: v0.2.3
          command: build
          source: build/okf
          destination: site

      - name: Add Atom feed
        run: cp build/feed.xml site/feed.xml

      - name: Generative front page
        run: uv run python -m genui.build
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
